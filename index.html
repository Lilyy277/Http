<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lily's file</title>
    <style>
        * {
            box-sizing: border-box;
            border-radius: 0px !important;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #fdf2f8;
            color: #1f2937;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: #ffffff;
            border: 2px solid #db2777;
            padding: 20px;
            box-shadow: 4px 4px 0px #be185d;
        }

        h1 {
            color: #be185d;
            font-size: 28px;
            text-align: center;
            margin-bottom: 20px;
            text-transform: lowercase;
            font-weight: bold;
        }

        /* Top Profile Grid Structure */
        .profile-section {
            display: flex;
            flex-direction: row-reverse;
            gap: 15px;
            align-items: center;
            margin-bottom: 25px;
            background-color: #fff5f8;
            border: 2px solid #f472b6;
            padding: 12px;
        }

        /* Image Column (Right side in RTL) */
        .image-container {
            flex: 0 0 140px;
            width: 140px;
            height: 140px;
            border: 2px solid #db2777;
            background-color: #fbcfe8;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Actions Column (Left side in RTL) */
        .actions-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            display: block;
            text-align: center;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            background-color: #db2777;
            border: 2px solid #9d174d;
            box-shadow: 2px 2px 0px #9d174d;
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .action-btn.netflix {
            background-color: #e50914;
            border-color: #b80710;
            box-shadow: 2px 2px 0px #800000;
        }

        /* Grid-based Custom Table */
        .table-title {
            color: #be185d;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .custom-table {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border: 2px solid #db2777;
            background-color: #ffffff;
        }

        .table-header {
            background-color: #db2777;
            color: #ffffff;
            font-weight: bold;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            border-bottom: 2px solid #db2777;
        }

        .table-cell {
            padding: 8px;
            font-size: 13px;
            text-align: center;
            border-bottom: 1px solid #f472b6;
            border-left: 1px solid #f472b6;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        .table-cell:nth-child(3n) {
            border-left: none;
        }

        .table-row-even {
            background-color: #fff5f8;
        }

        @media (max-width: 480px) {
            .profile-section {
                flex-direction: column;
            }
            .image-container {
                width: 100%;
                height: 180px;
            }
            .actions-container {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>lily's file</h1>

        <!-- Profile Section: Image on Right, Links on Left -->
        <div class="profile-section">
            <!-- Image (Right Side) -->
            <div class="image-container">
                <img src="Lily.jpg" alt="תמונה אישית">
            </div>

            <!-- Links (Left Side) -->
            <div class="actions-container">
                <a href="https://www.netflix.com" target="_blank" class="action-btn netflix">
                    מעבר לנטפליקס
                </a>
                <a href="mailto:LILYCOHEN2010@GMAIL.COM" class="action-btn">
                    שלח מייל ללילי
                </a>
            </div>
        </div>

        <!-- Custom Structured Table -->
        <div class="table-title">המועדפים שלי</div>
        <div class="custom-table">
            <!-- Headers -->
            <div class="table-header">מאכלים</div>
            <div class="table-header">סרטים שהשפיעו</div>
            <div class="table-header">שירים שאהובים</div>

            <!-- Row 1 -->
            <div class="table-cell table-row-even">פסטה</div>
            <div class="table-cell table-row-even">JAMESY BOY</div>
            <div class="table-cell table-row-even">LANA DEL REY - TOMORROW NEVER CAME</div>

            <!-- Row 2 -->
            <div class="table-cell">סושי</div>
            <div class="table-cell">GOOD WILL HUNTING</div>
            <div class="table-cell">RADIOHEAD - WEIRD FISHES / ARPEGGI</div>

            <!-- Row 3 -->
            <div class="table-cell table-row-even">המבורגר</div>
            <div class="table-cell table-row-even">DEAD POETS SOCIETY</div>
            <div class="table-cell table-row-even">SUKI WATERHOUSE - VALENTINE</div>
        </div>
    </div>

</body>
</html>
